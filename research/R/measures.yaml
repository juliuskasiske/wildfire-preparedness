# R — the measure catalogue.
# Schema in README.md. Cell statuses: REQUIRED | PROHIBITED | DISCLOSE_ONLY |
# VOLUNTARY_CREDIT | CERT_REQUIRED | RECOMMENDED | NOT_APPLICABLE
# Costs: Headwaters Economics 2024, CA installed, reference home 40x25 ft, 130 LF perimeter.
# Savings: RFF WP 25-30 Tables 3-4, market-share-weighted, full-premium / wildfire-portion.

measures:

# ============================== ROOF ==============================

- id: roof.class_a
  name: Replace roof covering with a Class A fire-rated assembly
  component: roof
  pathway: EMBER
  feature: {attribute: roof_material, compliant_when: "roof_material != WOOD_SHAKE and assembly is Class A"}
  regimes:
    sfw: {status: VOLUNTARY_CREDIT, clock: {basis: ALREADY_IN_FORCE}, citation: "10 CCR 2644.9, Building Hardening: Class-A Fire Rated Roof"}
    ab38_retro: {status: DISCLOSE_ONLY, clock: {basis: ON_REPLACEMENT}, list: hardening, item: 1, citation: "OSFM Low-Cost Retrofit List 1/1/2026 #1 — 'When it is time to replace your roof'"}
    ab38_feat: {status: DISCLOSE_ONLY, clock: {basis: ON_TRANSACTION}, citation: "Civ. Code 1102.6f — 'untreated wood shingles or shakes'"}
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS: replace wood shake/shingle with Class A. Barrel tile and some metal also need bird stops."}
    zone0: {status: NOT_APPLICABLE}
    prc4291: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Headwaters: wood roofs a $6B wildfire problem. Largest single SFW discount."}
  detection: {method: AERIAL_CV, confidence: HIGH, note: "Wood shake vs not is the highest-value overhead detection. Established in insurance CV."}
  cost: {unit: SF, low: 4.96, high: 18.68, typical_job: 6300, source: "$4.96/SF composition incl. synthetic underlayment; $18.68/SF metal"}
  savings: {sfw_item: class_a_roof, pct_full: 1.88, usd_full: 31.38, usd_wildfire: 7.61, note: "Largest single-item discount of all 12."}
  suppress_if: "year_built >= 2008 and in_sra_or_vhfhsz_lra"

- id: roof.debris_clear
  name: Keep roof clear of leaves, needles and vegetative debris
  component: roof
  pathway: EMBER
  feature: {attribute: roof_debris_present, compliant_when: "roof_debris_present == false"}
  regimes:
    prc4291: {status: REQUIRED, clock: {basis: ALREADY_IN_FORCE}, citation: "PRC 4291 — maintain the roof free of leaves, needles or other vegetative materials"}
    zone0: {status: REQUIRED, phase: IMMEDIATE, clock: {basis: ON_EFFECTIVE_DATE, set_by: STATE}, citation: "BOF Zone 0 Aug 2026 — combustible debris on roofs required to be removed upon the effective date"}
    ab38_retro: {status: DISCLOSE_ONLY, list: defensible_space, item: 1}
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL}
    sfw: {status: NOT_APPLICABLE, note: "Rolled into PRC 4291 compliance credit"}
  evidence: {weight: 3, basis: "Primary ember accumulation site. IBHS full-scale testing."}
  detection: {method: AERIAL_CV, confidence: MEDIUM, note: "Better inferred from canopy_overhangs_roof as a proxy."}
  cost: {unit: NONE, low: 0, high: 0, typical_job: 0, source: "DIY, recurring"}
  recurring: true

- id: roof.birdstops
  name: Block gaps between roof covering and sheathing with noncombustible bird stops
  component: roof
  pathway: EMBER
  feature: {attribute: roof_material, compliant_when: "birdstops present where roof profile leaves gaps (tile, some metal)"}
  regimes:
    ab38_retro: {status: DISCLOSE_ONLY, list: hardening, item: 2, citation: "OSFM LCRL #2"}
    ab38_feat: {status: DISCLOSE_ONLY, citation: "Civ. Code 1102.6f — 'loose or missing bird stopping or roof flashing'"}
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS: barrel tile and some metal must include bird stops at the edges"}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Direct ember pathway into the attic under profiled roofing."}
  detection: {method: SURVEY, confidence: LOW, note: "Only relevant if roof_material in (TILE, METAL). Gate the question."}
  cost: {unit: SF, low: 20.26, high: 20.26, typical_job: 800, source: "Headwaters $20.26/SF birdstop material"}
  applies_only_if: "roof_material in ('TILE','METAL')"

- id: roof.skylight_mesh
  name: Cover operable skylight openings with noncombustible metal mesh, max 1/8 inch
  component: roof
  pathway: EMBER
  feature: {attribute: skylight_operable_or_domed, compliant_when: "operable skylight openings screened at <= 1/8 in"}
  regimes:
    ab38_retro: {status: DISCLOSE_ONLY, list: hardening, item: 11, citation: "OSFM LCRL #11 — 'openings in the screen not to exceed 1/8 inch'"}
    ibhs: {status: NOT_APPLICABLE}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Direct opening into the conditioned space."}
  detection: {method: AERIAL_CV, confidence: MEDIUM, note: "Skylight presence detects well; operability does not. Gate a survey question on presence."}
  cost: {unit: EA, low: 20, high: 80, typical_job: 60, source: "DIY mesh"}
  applies_only_if: "skylight_present == true"

- id: roof.skylight_flat_tempered
  name: Replace domed plastic skylights with flat multipane tempered glass
  component: roof
  pathway: EMBER
  feature: {attribute: skylight_operable_or_domed, compliant_when: "skylight is flat multipane tempered glass"}
  regimes:
    ibhs: {status: CERT_REQUIRED, level: ENHANCED, citation: "IBHS Plus #5 — replace domed plastic skylights"}
    ab38_retro: {status: NOT_APPLICABLE}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Plastic domes deform and fail under radiant heat."}
  detection: {method: AERIAL_CV, confidence: MEDIUM}
  cost: {unit: EA, low: 1434.88, high: 1434.88, typical_job: 1435, source: "Headwaters, incl. labour and demolition"}
  applies_only_if: "skylight_present == true"

- id: roof.branches_above_roof
  name: Trim tree branches to at least 5 feet above the roof
  component: roof
  pathway: EMBER
  feature: {attribute: canopy_overhangs_roof, compliant_when: "no canopy within 5 ft above roof plane"}
  regimes:
    zone0: {status: REQUIRED, phase: PHASE_1, clock: {basis: EFFECTIVE_PLUS_YEARS, years: 3, set_by: STATE}, citation: "BOF Zone 0 Aug 2026 TREES — 'Branches should also be trimmed five feet above roofs'"}
    prc4291: {status: REQUIRED, clock: {basis: ALREADY_IN_FORCE}, citation: "PRC 4291 — maintain trees adjacent to or overhanging a building free of dead or dying wood"}
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS: remove trees and trim branches that overhang the 5 ft area; the home buffer extends to the sky"}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Syphard & Keeley: vegetation overhanging or touching the structure among the most effective actions."}
  detection: {method: GIS, confidence: HIGH, note: "Canopy height model intersected with roof polygon. Cleanest detection in the whole system."}
  cost: {unit: JOB, low: 300, high: 1500, typical_job: 700, source: "Arborist, CA"}

# ============================== GUTTER ==============================

- id: gutter.debris_clear
  name: Keep gutters clear of leaves and needles
  component: gutter
  pathway: EMBER
  feature: {attribute: roof_debris_present, compliant_when: "gutters free of vegetative debris"}
  regimes:
    zone0: {status: REQUIRED, phase: IMMEDIATE, clock: {basis: ON_EFFECTIVE_DATE, set_by: STATE}, citation: "BOF Zone 0 Aug 2026 — combustible debris in rain gutters removed upon the effective date"}
    prc4291: {status: REQUIRED, clock: {basis: ALREADY_IN_FORCE}, citation: "PRC 4291 — maintain the roof of a structure free of leaves, needles or other vegetative materials; gutters treated as part of the roof assembly by inspectors"}
    ab38_retro: {status: DISCLOSE_ONLY, list: defensible_space, item: 1}
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Classic ember trap directly against the fascia and roof edge."}
  detection: {method: AERIAL_CV, confidence: LOW, note: "Infer from canopy_overhangs_roof."}
  cost: {unit: NONE, low: 0, high: 200, typical_job: 0, source: "DIY, recurring"}
  recurring: true

- id: gutter.noncombustible_cover
  name: Install noncombustible gutter covers
  component: gutter
  pathway: EMBER
  feature: {attribute: gutter_cover_present, compliant_when: "gutter_cover_present == true and noncombustible"}
  regimes:
    ab38_retro: {status: DISCLOSE_ONLY, list: hardening, item: 3, citation: "OSFM LCRL #3"}
    ab38_feat: {status: DISCLOSE_ONLY, citation: "Civ. Code 1102.6f — 'rain gutters without metal or noncombustible gutter covers'"}
    ibhs: {status: CERT_REQUIRED, level: ENHANCED, citation: "IBHS Plus #2 — cover gutters"}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Removes the recurring maintenance failure mode rather than the hazard itself."}
  detection: {method: SURVEY, confidence: LOW}
  cost: {unit: LF, low: 4.48, high: 4.48, typical_job: 580, source: "Headwaters $4.48/LF, ~$220 per 50 ft side"}

- id: gutter.metal_replacement
  name: Replace plastic or vinyl gutters and downspouts with metal
  component: gutter
  pathway: EMBER
  feature: {attribute: gutter_material, compliant_when: "gutter_material == METAL"}
  regimes:
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS: replace plastic/vinyl gutters and downspouts with metal"}
    ab38_retro: {status: NOT_APPLICABLE}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Vinyl gutters melt and drop burning debris against the wall base."}
  detection: {method: STREETVIEW_CV, confidence: LOW}
  cost: {unit: LF, low: 18.78, high: 18.78, typical_job: 2400, source: "Headwaters, ~$930 per side"}

- id: gutter.metal_drip_edge
  name: Install a metal drip edge at the roof edge
  component: gutter
  pathway: EMBER
  feature: {attribute: gutter_present, compliant_when: "metal drip edge installed"}
  regimes:
    ibhs: {status: RECOMMENDED}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
    ab38_retro: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Headwaters lists it as a complementary low-cost measure at all retrofit tiers."}
  detection: {method: SURVEY, confidence: LOW}
  cost: {unit: LF, low: 2.93, high: 2.93, typical_job: 380, source: "Headwaters $2.93/LF; $100-200 per roof side"}
  divergence_note: "Cheap and effective but appears in no regime. Pure evidence-column item."

# ============================== CHIMNEY ==============================

- id: chimney.spark_arrestor
  name: Fit a corrosion-resistant metal spark arrestor, 3/8 to 1/2 inch openings
  component: chimney
  pathway: EMBER
  feature: {attribute: chimney_present, compliant_when: "spark arrestor fitted, 3/8-1/2 in mesh"}
  regimes:
    ab38_retro: {status: DISCLOSE_ONLY, list: hardening, item: 4, citation: "OSFM LCRL #4 — 'with 3/8-inch to 1/2-inch openings'"}
    ibhs: {status: NOT_APPLICABLE}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Prevents the home from being an ember SOURCE as well as a receptor."}
  detection: {method: AERIAL_CV, confidence: MEDIUM, note: "Chimney presence detects; arrestor does not. Gate a survey question."}
  cost: {unit: EA, low: 60, high: 300, typical_job: 150}
  applies_only_if: "chimney_present == true"

- id: chimney.branch_clearance_10ft
  name: Remove tree branches within 10 feet of a chimney or stovepipe outlet
  component: chimney
  pathway: EMBER
  feature: {attribute: canopy_overhangs_roof, compliant_when: "no branch within 10 ft of outlet"}
  regimes:
    prc4291: {status: REQUIRED, clock: {basis: ALREADY_IN_FORCE}, citation: "PRC 4291 — remove that portion of a tree that extends within 10 feet of the outlet of a chimney or stovepipe"}
    zone0: {status: REQUIRED, phase: IMMEDIATE, clock: {basis: ON_EFFECTIVE_DATE, set_by: STATE}, citation: "BOF Zone 0 Aug 2026 TREES — 'Branches should be ten feet from chimneys and kept clear of eaves per existing statute (effective immediately)'"}
    ibhs: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Long-standing statutory requirement."}
  detection: {method: GIS, confidence: MEDIUM, note: "Requires chimney location on the roof polygon plus CHM."}
  cost: {unit: JOB, low: 200, high: 800, typical_job: 400}
  applies_only_if: "chimney_present == true"

# ============================== VENTS ==============================

- id: vent.ember_resistant
  name: Install WUI-listed ember and flame resistant vents
  component: vent
  pathway: EMBER
  feature: {attribute: vent_type, compliant_when: "vent_type == WUI_LISTED"}
  regimes:
    sfw: {status: VOLUNTARY_CREDIT, clock: {basis: ALREADY_IN_FORCE}, citation: "10 CCR 2644.9, Building Hardening: Fire-Resistant Vents"}
    ab38_retro: {status: DISCLOSE_ONLY, list: hardening, item: 5, citation: "OSFM LCRL #5 — consult local building official, may reduce airflow"}
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS: install ember-resistant vents OR cover all existing vents with 1/8-inch metal wire mesh"}
    zone0: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Syphard & Keeley: vent screen size among the strongest structural predictors of survival."}
  detection: {method: SURVEY, confidence: LOW, note: "Not reliably detectable from any imagery. Canonical survey question."}
  cost: {unit: EA, low: 53.02, high: 420.80, typical_job: 2458, source: "Headwaters: $53 circular, $105 eave, $229 foundation, $421 gable end"}
  savings: {sfw_item: fire_resistant_vents, pct_full: 0.30, usd_full: 5.59, usd_wildfire: 5.33}
  suppress_if: "year_built >= 2008 and in_sra_or_vhfhsz_lra"

- id: vent.mesh_1_8
  name: Cover existing vents with 1/8 inch or finer corrosion-resistant metal mesh
  component: vent
  pathway: EMBER
  feature: {attribute: vent_type, compliant_when: "vent_type in (MESH_LE_1_8, WUI_LISTED)"}
  regimes:
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS: cover all existing vents with 1/8-inch metal wire mesh"}
    ab38_feat: {status: DISCLOSE_ONLY, citation: "Civ. Code 1102.6f — 'eave, soffit, and roof ventilation where the vents have openings in excess of one-eighth of an inch'"}
    sfw: {status: NOT_APPLICABLE, note: "SFW credits fire-resistant vents; mesh alone may not qualify. Verify with carrier."}
    zone0: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Same as vent.ember_resistant, at ~5% of the cost. Best cost-effectiveness ratio in the catalogue."}
  detection: {method: SURVEY, confidence: LOW}
  cost: {unit: EA, low: 10, high: 30, typical_job: 300, source: "DIY mesh, ~12 vents"}
  note: "The cheap path to the same pathway. Lead with this, not vent.ember_resistant."

- id: vent.dryer_louvered
  name: Ensure the dryer vent has working louvers or a flap
  component: vent
  pathway: EMBER
  feature: {attribute: vent_type, compliant_when: "dryer vent has functioning louvers or flap"}
  regimes:
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS: wire mesh should NOT be used on dryer vents"}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
    ab38_retro: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Mesh on a dryer vent creates a lint fire hazard. Louvers are the correct control."}
  detection: {method: SURVEY, confidence: LOW}
  cost: {unit: EA, low: 0, high: 70, typical_job: 30}

- id: vent.dryer_metal
  name: Install a metal dryer vent with louvers or a flap
  component: vent
  pathway: EMBER
  feature: {attribute: vent_type, compliant_when: "dryer vent is metal with louvers"}
  regimes:
    ibhs: {status: CERT_REQUIRED, level: ENHANCED, citation: "IBHS Plus #3"}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
    ab38_retro: {status: NOT_APPLICABLE}
  evidence: {weight: 1}
  detection: {method: SURVEY, confidence: LOW}
  cost: {unit: EA, low: 68.70, high: 68.70, typical_job: 69, source: "Headwaters"}

# ============================== EAVES ==============================

- id: eave.enclosed
  name: Enclose the underside of eaves with noncombustible or ignition-resistant soffit
  component: eave
  pathway: RADIANT
  feature: {attribute: eaves_enclosed, compliant_when: "eaves_enclosed == true with noncombustible or ignition-resistant material"}
  regimes:
    sfw: {status: VOLUNTARY_CREDIT, clock: {basis: ALREADY_IN_FORCE}, citation: "10 CCR 2644.9, Building Hardening: Enclosed Eaves"}
    ibhs: {status: CERT_REQUIRED, level: ENHANCED, citation: "IBHS Plus #1 — fiber-cement board or 2-inch nominal or thicker lumber; soffit vents ember-resistant or 1/8-inch mesh"}
    zone0: {status: NOT_APPLICABLE}
    ab38_retro: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Syphard & Keeley: enclosed eaves among the most consistently important structural characteristics. Radiant heat builds up in open eave geometry."}
  detection: {method: STREETVIEW_CV, confidence: MEDIUM, note: "Detectable on the front elevation only."}
  cost: {unit: SF, low: 4.51, high: 4.51, typical_job: 4000, source: "Headwaters, ~$4,000 for a typical eave overhang"}
  savings: {sfw_item: enclosed_eaves, pct_full: 0.30, usd_full: 5.10, usd_wildfire: 4.21}
  suppress_if: "year_built >= 2008 and in_sra_or_vhfhsz_lra"

- id: eave.rafter_gap_caulk
  name: Caulk or plug gaps greater than 1/8 inch around exposed rafters and blocking
  component: eave
  pathway: EMBER
  feature: {attribute: eaves_enclosed, compliant_when: "no gaps > 1/8 in at rafter and blocking penetrations"}
  regimes:
    ab38_retro: {status: DISCLOSE_ONLY, list: hardening, item: 6, citation: "OSFM LCRL #6"}
    ibhs: {status: NOT_APPLICABLE}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Direct ember path into the attic on open-eave construction."}
  detection: {method: SURVEY, confidence: LOW}
  cost: {unit: LF, low: 4.38, high: 4.38, typical_job: 570, source: "Headwaters fire-rated caulk $4.38/LF"}
  applies_only_if: "eaves_enclosed == false"

# ============================== SIDING / WALL ==============================

- id: siding.vertical_clearance_6in
  name: Provide at least 6 inches of noncombustible material at the bottom of exterior walls
  component: siding
  pathway: FLAME
  feature: {attribute: vertical_clearance_6in_present, compliant_when: ">= 6 in noncombustible measured from grade and from any attached horizontal surface"}
  regimes:
    sfw: {status: VOLUNTARY_CREDIT, clock: {basis: ALREADY_IN_FORCE}, citation: "10 CCR 2644.9 — 'at least six (6) inches of noncombustible vertical clearance at the bottom of the exterior surface'"}
    ibhs: {status: CERT_REQUIRED, level: ESSENTIAL, citation: "IBHS #3 — fiber-cement, brick, stone, stucco or exposed concrete foundation; metal flashing acceptable above deck surfaces and posts"}
    zone0: {status: NOT_APPLICABLE}
    ab38_retro: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Interrupts the ground-fire-to-siding ignition path, which is the dominant Zone 0 failure mode."}
  detection: {method: STREETVIEW_CV, confidence: LOW}
  cost: {unit: SF, low: 6.67, high: 6.67, typical_job: 434, source: "Headwaters $6.67/SF; 130 LF x 0.5 ft = 65 SF"}
  savings: {sfw_item: vertical_clearance, pct_full: 0.30, usd_full: 5.10, usd_wildfire: 4.02}
  note: "Cheapest of the five SFW building-hardening items by a wide margin. Lead with it."

- id: siding.gap_caulk_and_repair
  name: Caulk or plug siding gaps over 1/8 inch and replace dry-rotted boards
  component: siding
  pathway: EMBER
  feature: {attribute: siding_material, compliant_when: "no gaps > 1/8 in, no dry rot, no warped or damaged boards"}
  regimes:
    ab38_retro: {status: DISCLOSE_ONLY, list: hardening, item: 7, citation: "OSFM LCRL #7 — inspect for dry rot, gaps, cracks and warping"}
    ibhs: {status: NOT_APPLICABLE}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Embers lodge in gaps and smoulder against sheathing."}
  detection: {method: STREETVIEW_CV, confidence: LOW}
  cost: {unit: LF, low: 4.38, high: 4.38, typical_job: 600}

- id: siding.noncombustible
  name: Replace combustible siding with noncombustible or ignition-resistant material
  component: siding
  pathway: RADIANT
  feature: {attribute: siding_material, compliant_when: "siding_material in (STUCCO, FIBER_CEMENT, MASONRY, METAL)"}
  regimes:
    ibhs: {status: CERT_REQUIRED, level: ENHANCED, citation: "IBHS Plus #6 — replace wood, engineered wood-fiber or vinyl siding; also replace combustible decorative shutters"}
    ab38_retro: {status: DISCLOSE_ONLY, clock: {basis: ON_REPLACEMENT}, list: hardening, item: 10, citation: "OSFM LCRL #10 — 'When it's time to replace your siding or deck'"}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Matters under sustained radiant exposure, less so for pure ember attack."}
  detection: {method: STREETVIEW_CV, confidence: MEDIUM, note: "Coarse material classes reach macro-F1 0.91-0.96 in published work."}
  cost: {unit: SF, low: 6.67, high: 6.67, typical_job: 12000, source: "Headwaters fiber-cement $6.67/SF"}
  suppress_if: "year_built >= 2008 and in_sra_or_vhfhsz_lra"

- id: bay_window.enclose_under
  name: Enclose the open area beneath a ground-floor bay window
  component: siding
  pathway: EMBER
  feature: {attribute: siding_material, compliant_when: "no open cavity under ground-floor bay windows"}
  regimes:
    ibhs: {status: CERT_REQUIRED, level: ENHANCED, citation: "IBHS Plus #7"}
    zone0: {status: NOT_APPLICABLE}
    sfw: {status: NOT_APPLICABLE}
    ab38_retro: {status: NOT_APPLICABLE}
  evidence: {weight: 2, basis: "Sheltered cavity that collects embers directly against the wall."}
  detection: {method: STREETVIEW_CV, confidence: LOW}
  cost: {unit: JOB, low: 400, high: 1500, typical_job: 800}

# ============================== WINDOWS / DOORS ==============================

- id: window.multipane_tempered
  name: Replace windows with multipane glazing including at least one tempered pane
  component: window
  pathway: RADIANT
  feature: {attribute: window_glazing, compliant_when: "window_glazing == DUAL_TEMPERED"}
  regimes:
    sfw: {status: VOLUNTARY_CREDIT, clock: {basis: ALREADY_IN_FORCE}, citation: "10 CCR 2644.9 — 'multipane or dual-pane windows, or functional shutters'. EITHER satisfies."}
    ab38_retro: {status: DISCLOSE_ONLY, clock: {basis: ON_REPLACEMENT}, list: hardening, item: 9, citation: "OSFM LCRL #9 — 'When it's time to replace your windows'"}
    ab38_feat: {status: DISCLOSE_ONLY, citation: "Civ. Code 1102.6f — 'single pane or nontempered glass windows'"}
    ibhs: {status: CERT_REQUIRED, level: ENHANCED, citation: "IBHS Plus #5 — tempered multipaned glass, at least 2 panes tempered, or fire-resistant glass blocks"}
    zone0: {status: NOT_APPLICABLE}
  evidence: {weight: 3, basis: "Syphard & Keeley: number of window panes among the strongest structural predictors."}
